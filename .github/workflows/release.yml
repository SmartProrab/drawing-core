# Выпуск по тегу vX.Y.Z: все цели (iOS собирается только на macOS) → GitHub Packages:
#  - Maven: pro.smartprorab:drawing-core:X.Y.Z (jvm, android, ios + метаданные KMP)
#  - npm:   @smartprorab/drawing-core@X.Y.Z (ES-модуль + .d.ts)
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@smartprorab'

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Tests on all targets
        run: ./gradlew allTests -PlibVersion=$VERSION

      - name: Publish Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -PlibVersion=$VERSION

      - name: Publish npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew jsBrowserProductionLibraryDistribution -PlibVersion=$VERSION
          cd build/dist/js/productionLibrary
          npm pkg set name=@smartprorab/drawing-core version=$VERSION \
            repository.type=git repository.url=https://github.com/SmartProrab/drawing-core.git \
            publishConfig.registry=https://npm.pkg.github.com
          npm publish
